<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
    <style>
@import url('https://fonts.googleapis.com/css2?family=Buda:wght@300&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Oswald:wght@200..700&family=Playwrite+DE+Grund+Guides&family=Roboto:ital,wght@0,100..900;1,100..900&family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap');
</style>
    <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="login-form">
    <div class="image">
  </div>
  <div class="form">
    <h1>Login Form</h1>
    <div class="email">
    <label for="email">Email :</label>
    <input type="email" name="email" id="email" placeholder="Enter your email" required>
    </div>
    <div class="password">
    <label for="password">Password :</label>
    <input type="password" name="password" id="password" placeholder="Enter your password" required>
    </div>
    <div class="btn">
        <button>Login</button>
    </div>
    <div class="text">
        <p><a href="#">Forgot Password?</a></p>
    </div>
  </div>
</body>
</html>
